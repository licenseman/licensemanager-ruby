# Written by the licensemanager SDK release script: changes made here are overwritten.
# Publishes the gem to RubyGems when a version tag is pushed, with RubyGems trusted publishing (OIDC): no API key needed.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Check the version isn't published yet
        id: check
        run: |
          gemspec=$(ls *.gemspec)
          read -r name version < <(ruby -e 'spec = Gem::Specification.load(ARGV[0]); puts "#{spec.name} #{spec.version}"' "$gemspec")
          echo "gemspec=$gemspec" >> "$GITHUB_OUTPUT"
          echo "gem=$name-$version.gem" >> "$GITHUB_OUTPUT"
          if curl -fsS -o /dev/null "https://rubygems.org/api/v2/rubygems/$name/versions/$version.json"; then
            echo "$name $version is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.published != 'true'
        uses: rubygems/configure-rubygems-credentials@v2.1.0
      - if: steps.check.outputs.published != 'true'
        run: |
          gem build "${{ steps.check.outputs.gemspec }}"
          gem push "${{ steps.check.outputs.gem }}"
